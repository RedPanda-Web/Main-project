<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">

        <title>Aurum</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">

    <body>
        <img id="banner" src="Images/banner.png" alt="Aurum Banner">

                <div class = "footer-right">
                    <div class = "email">
