        <main class="inquire">
            <div class="inquire-form">
                <h1>Inquire About a Piece</h1>
                <p class="inquire-intro">What piece caught your eye? I’ll handle the rest.</p>
                <form action="submit_inquiry.php" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="piece">Piece</label>
                    <input type="text" id="piece" name="piece" required>

                    <label for="extra">Extra</label>
                    <textarea id="extra" name="extra" rows="5" placeholder="Feel free to leave any extra details in this box..."></textarea>

                    <button type="submit">Send Inquiry</button>
                </form>
            </div>
        </main>
        <div class="footer">
            <hr class="exclude">
